name: flutter_packages
description: Flutter packages monorepo workspace.
publish_to: none

environment:
  sdk: ^3.6.0

workspace:
  - apps/example
  - packages/ddlog
  - packages/ddlog/example
  - packages/en_expansion_panel
  - packages/en_expansion_panel/example
  - packages/en_stepper
  - packages/en_stepper/example
  - packages/align_overlay
  - packages/align_overlay/example
  - packages/route_stack_manager
  - packages/route_stack_manager/example
  - packages/tap_track
  - packages/tap_track/example

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  melos: ^6.3.2

flutter:
  uses-material-design: true
