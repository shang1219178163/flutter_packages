name: Publish route_stack_manager

# Package: https://pub.dev/packages/route_stack_manager
# Tag example: route_stack_manager-v1.2.1
on:
  push:
    tags:
      - 'route_stack_manager-v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/route_stack_manager

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Flutter bin is first in PATH
        run: echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Verify Flutter & Dart
        run: |
          which flutter
          which dart
          flutter --version
          dart --version

      - name: Resolve workspace dependencies
        working-directory: .
        run: dart pub get

      - name: Publish package to pub.dev
        env:
          PUB_CREDENTIALS: ${{ secrets.CREDENTIAL_JSON }}
        run: |
          mkdir -p "$HOME/.config/dart"
          printenv PUB_CREDENTIALS > "$HOME/.config/dart/pub-credentials.json"
          VERSION=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          echo "Publishing route_stack_manager $VERSION"
          flutter pub publish --dry-run
          flutter pub publish --force

      - name: Package on pub.dev
        if: always()
        run: |
          {
            echo "## Publish route_stack_manager"
            echo ""
            echo "- Package: [https://pub.dev/packages/route_stack_manager](https://pub.dev/packages/route_stack_manager)"
            echo "- Versions: [https://pub.dev/packages/route_stack_manager/versions](https://pub.dev/packages/route_stack_manager/versions)"
          } >> "$GITHUB_STEP_SUMMARY"
