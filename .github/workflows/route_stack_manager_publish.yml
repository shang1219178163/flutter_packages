name: Publish route_stack_manager

# Tag example: route_stack_manager-v1.2.1
on:
  push:
    tags:
      - 'route_stack_manager-v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/route_stack_manager

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Flutter bin is first in PATH
        run: echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Verify Flutter & Dart
        run: |
          which flutter
          which dart
          flutter --version
          dart --version

      - name: Resolve workspace dependencies
        working-directory: .
        run: dart pub get

      - name: Dry run publish
        run: flutter pub publish --dry-run

      - name: Publish package to pub.dev
        uses: k-paxian/dart-package-publisher@v1.5.1
        with:
          relativePath: packages/route_stack_manager
          credentialJson: ${{ secrets.CREDENTIAL_JSON }}
          flutter: true
          skipTests: true
          dryRunOnly: false
