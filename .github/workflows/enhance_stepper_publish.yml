name: Publish enhance_stepper

# Package: https://pub.dev/packages/enhance_stepper
# Tag example: enhance_stepper-v1.1.0
on:
  push:
    tags:
      - 'enhance_stepper-v*.*.*'

jobs:
  publish:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/enhance_stepper

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Flutter bin is first in PATH
        run: echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Verify Flutter & Dart
        run: |
          which flutter
          which dart
          flutter --version
          dart --version

      - name: Resolve workspace dependencies
        working-directory: .
        run: dart pub get

      - name: Publish package to pub.dev
        uses: k-paxian/dart-package-publisher@v1.5.1
        with:
          relativePath: packages/enhance_stepper
          credentialJson: ${{ secrets.CREDENTIAL_JSON }}
          flutter: true
          skipTests: true
          dryRunOnly: false

      - name: Package on pub.dev
        if: always()
        run: |
          {
            echo "## Publish enhance_stepper"
            echo ""
            echo "- Package: [https://pub.dev/packages/enhance_stepper](https://pub.dev/packages/enhance_stepper)"
            echo "- Versions: [https://pub.dev/packages/enhance_stepper/versions](https://pub.dev/packages/enhance_stepper/versions)"
          } >> "$GITHUB_STEP_SUMMARY"
